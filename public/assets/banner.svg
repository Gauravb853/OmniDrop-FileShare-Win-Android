<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="210" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="210" r="140" fill="#7c3aed" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="180" r="100" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />

  <!-- Logo and Brand Header -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Lightning Icon -->
    <path d="M -160 -18 L -140 -18 L -150 2 L -130 2 L -165 30 L -155 10 L -175 10 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
    <!-- Title -->
    <text x="-25" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1">OmniDrop</text>
    <!-- Subtitle -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">Fast, Bi-Directional Local File Transfer: Android ⇋ Windows</text>
  </g>

  <!-- Left: Windows PC Card -->
  <g transform="translate(140, 165)">
    <rect width="260" height="180" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="20" width="220" height="110" rx="10" fill="#0b0f19" stroke="#1e293b" />
    <!-- Screen content -->
    <rect x="35" y="35" width="80" height="60" rx="6" fill="#1e293b" />
    <path d="M 65 55 L 75 55 L 70 70 L 80 70 L 62 90 L 67 75 L 57 75 Z" fill="#38bdf8" />
    <text x="130" y="55" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">Windows PC</text>
    <text x="130" y="75" font-family="monospace" font-size="11" fill="#64748b">Port: 5050</text>
    <text x="130" y="93" font-family="monospace" font-size="11" fill="#10b981">● Ready</text>
    <!-- Stand -->
    <rect x="110" y="130" width="40" height="18" fill="#334155" />
    <rect x="90" y="148" width="80" height="6" rx="3" fill="#475569" />
    <!-- Label -->
    <text x="130" y="170" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Windows Host</text>
  </g>

  <!-- Center Transfer Waves & Speed Badge -->
  <g transform="translate(435, 210)">
    <!-- Speed Badge -->
    <rect x="55" y="-30" width="220" height="50" rx="25" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#glow)" />
    <text x="165" y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">⚡ 80 - 120+ MB/s</text>
    <text x="165" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">DIRECT WI-FI STREAM</text>

    <!-- Animated Wave Lines -->
    <path d="M 10 35 Q 165 -15 320 35" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />
    <path d="M 320 55 Q 165 105 10 55" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />

    <!-- Feature tags below -->
    <g transform="translate(165, 105)" text-anchor="middle">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Zero Dependencies • Unlimited Size • Resumable</text>
    </g>
  </g>

  <!-- Right: Android Mobile Phone Card -->
  <g transform="translate(800, 165)">
    <rect width="260" height="180" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Phone mockup -->
    <g transform="translate(85, 12)">
      <rect width="90" height="155" rx="16" fill="#0b0f19" stroke="#475569" stroke-width="2" />
      <!-- Screen -->
      <rect x="5" y="8" width="80" height="138" rx="12" fill="#0284c7" fill-opacity="0.15" />
      <!-- Notch / Camera -->
      <circle cx="45" cy="16" r="3" fill="#334155" />
      <!-- App card on phone -->
      <rect x="12" y="32" width="66" height="42" rx="6" fill="#1e293b" />
      <text x="45" y="52" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#38bdf8" text-anchor="middle">Incoming File</text>
      <text x="45" y="64" font-family="-apple-system, sans-serif" font-size="7" fill="#10b981" text-anchor="middle">[Accept]  [Cancel]</text>
      <!-- Progress Bar -->
      <rect x="15" y="86" width="60" height="6" rx="3" fill="#334155" />
      <rect x="15" y="86" width="46" height="6" rx="3" fill="url(#primaryGrad)" />
      <!-- Home bar -->
      <rect x="30" y="140" width="30" height="3" rx="1.5" fill="#64748b" />
    </g>
    <!-- Label -->
    <text x="130" y="170" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Android PWA</text>
  </g>
</svg>
